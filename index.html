
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fenland Plastering - Professional plastering services across Peterborough, Cambridgeshire and surrounding areas. New website coming soon.">
  <title>Fenland Plastering | Website Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #10243a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    .logo {
      width: 250px;
      max-width: 75%;
      height: auto;
      margin-bottom: 35px;
    }

    .accent {
      width: 55px;
      height: 4px;
      background: #f4c542;
      margin: 25px auto;
      border-radius: 3px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.15;
      margin: 0 0 18px;
    }

    .tagline {
      color: #f4c542;
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .message {
      color: #e1e7ee;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    footer {
      margin-top: 65px;
      color: #aebdca;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      src="logo.png"
      alt="Fenland Plastering"
      class="logo">

    <h1>Our new website is coming soon.</h1>

    <div class="accent"></div>

    <p class="tagline">
      Professional plastering. Quality finishes.
    </p>

    <p class="message">
      We're working on something new.
      Our website will be launching soon.
      <br>
      <br>
      Proudly serving Peterborough, Cambridgeshire
      and surrounding areas.
    </p>

    <footer>
      &copy; <span id="year"></span> Fenland Plastering.
      All rights reserved.
    </footer>

  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
